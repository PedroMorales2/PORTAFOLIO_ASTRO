<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pedro Morales — Ingeniero de Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060b"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b9dff"/>
      <stop offset="0.55" stop-color="#5cdfff"/>
      <stop offset="1" stop-color="#4be0c0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6473f0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6473f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="140" r="420" fill="url(#halo)"/>
  <!-- grilla -->
  <g stroke="#9aa4c8" stroke-opacity="0.06">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630"/>
  </g>
  <!-- anillos -->
  <g fill="none">
    <circle cx="980" cy="315" r="150" stroke="url(#acc)" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="980" cy="315" r="210" stroke="#8b9dff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 10"/>
    <circle cx="980" cy="315" r="90" fill="#6473f0" fill-opacity="0.25"/>
    <circle cx="980" cy="315" r="60" fill="#8b9dff" fill-opacity="0.5"/>
  </g>
  <g font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
    <text x="90" y="270" font-size="88" font-weight="700" fill="#f2f4f8" letter-spacing="-3">Pedro Morales</text>
    <text x="90" y="345" font-size="40" font-weight="500" fill="url(#acc)">Ingeniero de Software</text>
    <text x="92" y="420" font-size="24" fill="#99a1b3" font-family="'JetBrains Mono',monospace">Full Stack · IA · Backend · Móvil · Cloud</text>
    <text x="92" y="540" font-size="20" fill="#5d6474" font-family="'JetBrains Mono',monospace">github.com/PedroMorales2 — Chiclayo, Perú</text>
  </g>
  <rect x="90" y="460" width="120" height="4" rx="2" fill="url(#acc)"/>
