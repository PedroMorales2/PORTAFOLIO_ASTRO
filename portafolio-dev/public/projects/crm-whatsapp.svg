<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Burbujas de chat conectadas por flujos de automatización">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071410"/>
      <stop offset="1" stop-color="#0a1c1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4be0c0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4be0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="360" cy="300" r="330" fill="url(#halo)"/>
  <!-- burbujas de chat -->
  <g>
    <path d="M180 180 h340 a24 24 0 0 1 24 24 v90 a24 24 0 0 1 -24 24 h-280 l-48 44 v-44 h-12 a24 24 0 0 1 -24 -24 v-90 a24 24 0 0 1 24 -24 z" fill="#4be0c0" opacity="0.16"/>
    <rect x="212" y="216" width="240" height="13" rx="6.5" fill="#9ae8d4" opacity="0.65"/>
    <rect x="212" y="246" width="180" height="13" rx="6.5" fill="#9ae8d4" opacity="0.4"/>

    <path d="M700 340 h300 a24 24 0 0 1 24 24 v80 a24 24 0 0 1 -24 24 h-10 v44 l-48 -44 h-242 a24 24 0 0 1 -24 -24 v-80 a24 24 0 0 1 24 -24 z" fill="#4be0c0" opacity="0.32"/>
    <rect x="732" y="372" width="220" height="13" rx="6.5" fill="#0a1c1a" opacity="0.75"/>
    <rect x="732" y="402" width="150" height="13" rx="6.5" fill="#0a1c1a" opacity="0.55"/>
    <!-- doble check -->
    <g stroke="#0a1c1a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M950 430 l8 8 16 -18"/>
      <path d="M968 430 l8 8 16 -18"/>
    </g>
  </g>
  <!-- flujo n8n -->
  <g stroke="#4be0c0" stroke-opacity="0.45" fill="none" stroke-width="2">
    <path d="M240 560 H420 L500 640 H700 L780 560 H960"/>
    <path d="M500 640 V700"/>
  </g>
  <g fill="#0a1c1a" stroke="#4be0c0" stroke-width="2.5">
    <rect x="210" y="538" width="60" height="44" rx="10"/>
    <rect x="470" y="618" width="60" height="44" rx="10"/>
    <rect x="750" y="538" width="60" height="44" rx="10"/>
    <circle cx="960" cy="560" r="16"/>
  </g>
  <g fill="#4be0c0">
    <circle cx="240" cy="560" r="4"/>
    <circle cx="500" cy="640" r="4"/>
    <circle cx="780" cy="560" r="4"/>
    <circle cx="960" cy="560" r="5" opacity="0.9"/>
  </g>
  <!-- nodo IA -->
  <g transform="translate(500 720)">
    <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#4be0c0" opacity="0.2"/>
    <text x="0" y="6" font-family="'JetBrains Mono',monospace" font-size="17" font-weight="600" text-anchor="middle" fill="#9ae8d4">IA</text>
  </g>
</svg>
