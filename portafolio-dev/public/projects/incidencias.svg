<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mapa abstracto con clusters de incidencias">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c18"/>
      <stop offset="1" stop-color="#0d1024"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b9dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5cdfff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5cdfff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- calles -->
  <g stroke="#8b9dff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M0 180 H1200 M0 380 H1200 M0 600 H1200"/>
    <path d="M220 0 V800 M520 0 V800 M840 0 V800 M1060 0 V800"/>
    <path d="M0 100 L400 260 L700 210 L1200 330" stroke-opacity="0.22"/>
    <path d="M100 800 L360 520 L680 560 L900 420 L1200 470" stroke-opacity="0.22"/>
  </g>
  <!-- clusters -->
  <circle cx="420" cy="300" r="170" fill="url(#glow1)"/>
  <circle cx="850" cy="520" r="140" fill="url(#glow2)"/>
  <g fill="#8b9dff">
    <circle cx="392" cy="282" r="7"/><circle cx="438" cy="310" r="5"/><circle cx="410" cy="340" r="6"/>
    <circle cx="455" cy="270" r="4"/><circle cx="375" cy="320" r="4"/><circle cx="432" cy="255" r="5"/>
  </g>
  <g fill="#5cdfff">
    <circle cx="828" cy="505" r="6"/><circle cx="868" cy="530" r="5"/><circle cx="845" cy="558" r="4"/>
    <circle cx="885" cy="495" r="4"/><circle cx="815" cy="540" r="4"/>
  </g>
  <!-- anillos de cluster -->
  <circle cx="420" cy="300" r="95" fill="none" stroke="#8b9dff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 7"/>
  <circle cx="850" cy="520" r="75" fill="none" stroke="#5cdfff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 7"/>
  <!-- pin -->
  <g transform="translate(420 240)">
    <path d="M0 -34 C-19 -34 -30 -20 -30 -6 C-30 12 0 34 0 34 C0 34 30 12 30 -6 C30 -20 19 -34 0 -34 Z" fill="#8b9dff"/>
    <circle cx="0" cy="-7" r="10" fill="#0a0c18"/>
  </g>
  <!-- línea de pronóstico LSTM -->
  <path d="M80 700 C240 690 300 640 420 655 C560 672 640 600 780 615 C920 630 1020 560 1140 545"
        fill="none" stroke="#4be0c0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M80 700 C240 690 300 640 420 655 C560 672 640 600 780 615 C920 630 1020 560 1140 545"
        fill="none" stroke="#4be0c0" stroke-width="12" stroke-linecap="round" stroke-opacity="0.12"/>
</svg>
